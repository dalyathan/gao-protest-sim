case_id: B-424681
documents:
- id: solicitation_and_background
  tag: public
  text: 'Agency: Department of the Navy, Naval Air Systems Command

    Solicitation: RFP No. N6134026R1001

    Type: Negotiated procurement under FAR part 15; SDVOSB set-aside contemplating multiple IDIQ contracts for courseware
    revision and maintenance services

    Value: None

    Evaluation: Three-step gated process evaluating a technical factor and a past performance factor

    Offerors: None

    Protest type: pre-award


    The Navy issued RFP N6134026R1001 on January 30, 2026, as an SDVOSB set-aside under FAR part 15, contemplating
    multiple IDIQ contracts. The RFP required offerors to submit attachment L-1, a contract data sheet listing up
    to three recent and relevant contract references, which would be used to evaluate the technical and past performance
    factors. Proposal deadlines were extended several times, including to April 13 after a prior protest and agency
    corrective action. Hatalom submitted a proposal on April 10 that included its attachment L-1. The agency issued
    amendment 0004 on July 1, containing a PIEE note stating ''This submission will replace your original proposal
    in its entirety.'' Hatalom submitted a proposal under amendment 0004 by the deadline but omitted attachment
    L-1. The agency''s completeness review found the omission, and the proposal was deemed ineligible for award.
    On July 14, the agency notified Hatalom that it was eliminated from the competition. Hatalom asked the agency
    to waive the omission as an informality, the agency declined, and Hatalom filed this protest.'
- id: protester_view
  tag: debrief
  text: 'Protester: Hatalom Corporation (SDVOSB, Orlando, Florida) (incumbent: None). Awardee: None. Issues the
    protester has identified:

    g1: Hatalom contends the rejection was unreasonable because the agency already had its attachment L-1 from the
    April submission, so the agency possessed a complete proposal by the deadline. It argues the agency was therefore
    required to accept and evaluate the July proposal.

    g2: Hatalom contends the Navy wrongly concluded that the omission could not be waived as an informality or minor
    irregularity under FAR 52.215-1(f)(3).'
- id: agency_internal
  tag: agency_internal
  text: 'Agency''s view of its record: The Navy argues Hatalom failed to submit a complete proposal under amendment
    0004, and that the July submission replaced the April proposal in its entirety under the solicitation terms.
    It asserts attachment L-1 is material and mandatory, and that without it a proposal cannot be rated acceptable
    under the technical or past performance factors. The Navy conceded it erred in telling Hatalom that FAR 52.215-1
    did not apply, but maintains the proposal was properly excluded for omitting required material information.

    The agency opened Hatalom''s July proposal and reviewed it for completeness. The review found that attachment
    L-1 was missing from the submission. The agency deemed the proposal ineligible for award on that basis. The
    agency stated that attachment L-1 contains substantive information explicitly required for evaluation and declined
    to waive the omission. Hatalom''s attachment L-1 had been included in its April submission.'
- id: agency_report
  tag: apo
  available_from_turn: 2
  text: 'Agency report (protected record): The agency opened Hatalom''s July proposal and reviewed it for completeness.
    The review found that attachment L-1 was missing from the submission. The agency deemed the proposal ineligible
    for award on that basis. The agency stated that attachment L-1 contains substantive information explicitly required
    for evaluation and declined to waive the omission. Hatalom''s attachment L-1 had been included in its April
    submission.

    Agency arguments: The Navy argues Hatalom failed to submit a complete proposal under amendment 0004, and that
    the July submission replaced the April proposal in its entirety under the solicitation terms. It asserts attachment
    L-1 is material and mandatory, and that without it a proposal cannot be rated acceptable under the technical
    or past performance factors. The Navy conceded it erred in telling Hatalom that FAR 52.215-1 did not apply,
    but maintains the proposal was properly excluded for omitting required material information.'
