case_id: B-424759
documents:
- id: solicitation_and_background
  tag: public
  text: 'Agency: Department of Veterans Affairs (VA), VA Long Beach Healthcare System

    Solicitation: Purchase order No. 36C26226P0525 (bridge order); RFQ No. 36C26225Q1093 (long-term requirement,
    resulting in IDIQ contract No. 36C26226D0030)

    Type: Purchase order (short-term bridge) and IDIQ contract for non-emergent ambulance services

    Value: None

    Evaluation: None

    Offerors: None

    Protest type: post-award


    The VA issued purchase order No. 36C26226P0525 to Symbiosis as a short-term bridge order for non-emergent ambulance
    services at the VA Long Beach Healthcare System. The bridge order was issued to prevent a break in services
    while litigation over the competitive procurement for the long-term requirement was pending. The VA later awarded
    IDIQ contract No. 36C26226D0030 to EDG under RFQ No. 36C26225Q1093 for the long-term requirement. The VA exercised
    an option to extend services under Symbiosis'' purchase order. EDG then protested to GAO, arguing that the option
    could not be exercised because its price had not been evaluated when the order was awarded. In corrective action
    taken in response, the VA terminated the option under Symbiosis'' purchase order. Symbiosis separately raised
    concerns about EDG''s ongoing performance under the IDIQ contract.'
- id: protester_view
  tag: debrief
  text: 'Protester: Symons Emergency Specialties, Inc. d/b/a Symbiosis (Symbiosis) (incumbent: True). Awardee: EDG
    Entities LLC (EDG), a service-disabled veteran-owned small business. Issues the protester has identified:

    g1: The agency improperly terminated an option it had previously exercised under Symbiosis'' purchase order.

    g2: EDG is not complying with the limitation on subcontracting requirements applicable to its IDIQ contract.

    g3: The entity actually performing the ambulance services under EDG''s contract may lack the required licensing
    and regulatory authority in Los Angeles County.'
- id: agency_internal
  tag: agency_internal
  text: 'Agency''s view of its record: The VA terminated the option as corrective action after determining that
    it should not have been exercised. The contracting officer stated that he did not evaluate the pricing for the
    option to extend services when the order was awarded to Symbiosis. The agency maintained that the termination
    was a proper contract administration decision.

    The contracting officer''s statement says he did not evaluate the pricing for the option to extend services
    at the time of award to Symbiosis. The VA subsequently determined that this made exercise of the option improper.
    The long-term requirement was awarded to EDG, a service-disabled veteran-owned small business located in Long
    Beach, California. Symbiosis stated that it does not challenge EDG''s evaluation or award and instead targets
    EDG''s ongoing performance. The record does not show that the option was evaluated as part of the initial award.'
- id: agency_report
  tag: apo
  available_from_turn: 2
  text: 'Agency report (protected record): The contracting officer''s statement says he did not evaluate the pricing
    for the option to extend services at the time of award to Symbiosis. The VA subsequently determined that this
    made exercise of the option improper. The long-term requirement was awarded to EDG, a service-disabled veteran-owned
    small business located in Long Beach, California. Symbiosis stated that it does not challenge EDG''s evaluation
    or award and instead targets EDG''s ongoing performance. The record does not show that the option was evaluated
    as part of the initial award.

    Agency arguments: The VA terminated the option as corrective action after determining that it should not have
    been exercised. The contracting officer stated that he did not evaluate the pricing for the option to extend
    services when the order was awarded to Symbiosis. The agency maintained that the termination was a proper contract
    administration decision.'
